name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # package-lock.json is written by npm 11, which ships with this Node.js version; the committed
  # build/ was compiled with it.
  NODE_VERSION: '26.13.1'
  # WordPress core for the PHPUnit suite, checked against the SHA-256 of the release archive (its
  # SHA-1 matches the .sha1 file wordpress.org publishes beside it).
  WP_VERSION: '7.1.5'
  WP_SHA256: '053857d980eaee8702c617c685948becb9be2523ba0dcbc98e4dbb2300367c79'

jobs:
  php-lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: php -l on every PHP file
        run: find keepmerge-push-staging-to-live tests tools -name '*.php' -not -path '*/node_modules/*' -print0 | sort -z | xargs -0 -n1 php -l

  phpcs:
    name: PHPCS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install the development packages (composer.lock)
        env:
          # Composer downloads its packages from api.github.com; the token avoids the anonymous rate limit.
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: composer install --no-interaction --no-progress

      - name: PHP_CodeSniffer (WordPress, WordPress-Docs, PHPCompatibilityWP 7.4+)
        run: vendor/bin/phpcs

  js:
    name: JavaScript lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keepmerge-push-staging-to-live
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: keepmerge-push-staging-to-live/package-lock.json

      - name: Install the npm packages (package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Build
        run: npm run build

      - name: The committed build/ matches the source
        run: |
          git diff --exit-code -- build/
          untracked="$(git status --porcelain --untracked-files=all -- build/)"
          if [ -n "$untracked" ]; then
            echo "Files in build/ that are not committed:"
            echo "$untracked"
            exit 1
          fi

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress 7.1.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          # A throwaway database server that lives only as long as this job.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, curl, mbstring, sodium, zip, :imagick
          coverage: none
          tools: composer:v2

      - name: Install the development packages (composer.lock)
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: composer install --no-interaction --no-progress

      - name: Download WordPress
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wordpress.tar.gz" "https://wordpress.org/wordpress-$WP_VERSION.tar.gz"
          echo "$WP_SHA256  $RUNNER_TEMP/wordpress.tar.gz" | sha256sum -c -
          mkdir -p "$WP_CORE_DIR"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" --strip-components=1 -C "$WP_CORE_DIR"
          test -f "$WP_CORE_DIR/wp-settings.php"

      - name: PHPUnit
        run: vendor/bin/phpunit

  build:
    name: Build the plugin ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from readme.txt; the script refuses to build unless the plugin header
      # and SOFTGLAZE_SP_VERSION carry the same one.
      - name: Build the ZIP (tools/build-zip.ps1)
        shell: pwsh
        run: |
          $version = (Select-String -Path keepmerge-push-staging-to-live/readme.txt -Pattern '^Stable tag:\s*(\S+)').Matches[0].Groups[1].Value
          ./tools/build-zip.ps1 -Version $version

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
          tools: none

      - name: Audit the ZIP (tools/zip-audit.php)
        run: |
          php tools/zip-audit.php dist/keepmerge-push-staging-to-live.zip
          sha256sum dist/keepmerge-push-staging-to-live.zip

      - name: Upload the ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip
          path: dist/keepmerge-push-staging-to-live.zip
          if-no-files-found: error

  plugin-check:
    name: Plugin Check
    needs: build
    runs-on: ubuntu-24.04
    # Each Plugin Check step starts wp-env, which the action retries up to three times.
    timeout-minutes: 45
    steps:
      - name: Download the ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: dist

      - name: Unzip
        run: |
          unzip -q dist/keepmerge-push-staging-to-live.zip -d build
          test -f build/keepmerge-push-staging-to-live/keepmerge-push-staging-to-live.php

      # The checks of the WordPress.org upload form. strict makes warnings fail the job too.
      # The slug input also gives this run's results artifact its own name.
      - name: Plugin Check (plugin_repo category, without prefixing)
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/keepmerge-push-staging-to-live
          categories: plugin_repo
          exclude-checks: prefixing
          slug: keepmerge-push-staging-to-live
          strict: true
          repo-token: ''

      - name: Plugin Check (all default checks)
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/keepmerge-push-staging-to-live
          strict: true
          repo-token: ''
